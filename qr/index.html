<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR — Cyber Apparel Co.</title>
  <meta name="description" content="Cyber Apparel Co. QR routing gateway." />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://cyberapparel.store/" />
  </noscript>
  <style>
    .four-oh-four {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .four-oh-four-num {
      font-size: clamp(6rem, 20vw, 16rem);
      font-weight: 600;
      line-height: 1;
      color: rgba(255,255,255,0.04);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      letter-spacing: -0.04em;
    }
    .four-oh-four-content {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="../index.html" class="nav-logo">
    <span class="nav-logo-mark">CA</span>
    Cyber Apparel Co.
  </a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="../pages/drop001.html">Drop 001</a></li>

    <li><a href="../pages/about.html">About</a></li>
    <li><a href="../pages/legal.html">Legal / Marks</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="../index.html">Home</a>
  <a href="../pages/drop001.html">Drop 001</a>
  <a href="../pages/verify.html">Verify</a>
  <a href="../pages/about.html">About</a>
  <a href="../pages/legal.html">Legal / Marks</a>
</div>

<div class="four-oh-four">
  <div class="four-oh-four-num" aria-hidden="true">QR</div>
  <div class="four-oh-four-content">
    <div style="font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--dim);margin-bottom:1.5rem;">
      QR Gateway — Signal Received
    </div>
    <h1 id="router-title" style="font-size:clamp(1.4rem,3vw,2rem);font-weight:600;line-height:1.2;margin-bottom:1rem;">
      Resolving route.
    </h1>
    <p id="router-status" aria-live="polite" style="font-size:0.78rem;color:var(--dim);max-width:360px;line-height:1.8;font-weight:200;margin-bottom:2rem;">
      Connecting to the current Cyber Apparel Co. terminal.
    </p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a id="router-link" href="../index.html" class="btn btn-fill" hidden>Continue →</a>
      <noscript>
        <a href="https://cyberapparel.store/" class="btn btn-fill">Continue →</a>
      </noscript>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
  (async function () {
    'use strict';

    const title = document.getElementById('router-title');
    const status = document.getElementById('router-status');
    const link = document.getElementById('router-link');
    const params = new URLSearchParams(window.location.search);
    const requested = params.get('id') || params.get('route') || window.location.hash.slice(1);
    const routePattern = /^[a-z0-9][a-z0-9-]{0,63}$/;

    function showFallback(message) {
      title.textContent = 'Route unavailable.';
      status.textContent = message;
      link.href = '../index.html';
      link.textContent = '← Go Home';
      link.hidden = false;
    }

    function resolveRoute(routes, routeId) {
      let currentId = routeId;
      const visited = new Set();

      for (let depth = 0; depth < 16; depth += 1) {
        if (visited.has(currentId)) {
          throw new Error('Route alias cycle.');
        }

        visited.add(currentId);
        const route = routes[currentId];

        if (!route || route.enabled !== true) {
          return null;
        }

        if (typeof route.destination === 'string' && route.destination.trim()) {
          return {
            id: currentId,
            destination: route.destination.trim()
          };
        }

        if (typeof route.alias !== 'string' || !routePattern.test(route.alias)) {
          return null;
        }

        currentId = route.alias;
      }

      throw new Error('Route alias depth exceeded.');
    }

    try {
      const response = await fetch('./routes.json?v=' + Date.now(), {
        cache: 'no-store',
        credentials: 'same-origin'
      });

      if (!response.ok) {
        throw new Error('Route registry unavailable.');
      }

      const registry = await response.json();
      const routeId = requested || registry.default;

      if (typeof routeId !== 'string' || !routePattern.test(routeId)) {
        showFallback('The requested routing signal is invalid.');
        return;
      }

      if (!registry.routes || typeof registry.routes !== 'object') {
        throw new Error('Route registry invalid.');
      }

      const route = resolveRoute(registry.routes, routeId);

      if (!route) {
        showFallback('The requested routing signal is not active.');
        return;
      }

      const destination = new URL(route.destination, window.location.href);

      if (destination.protocol !== 'https:' && destination.protocol !== 'http:') {
        throw new Error('Route destination protocol blocked.');
      }

      title.textContent = 'The route resolved.';
      status.textContent = 'Continuing to the current Cyber Apparel Co. terminal.';
      link.href = destination.href;
      link.hidden = false;

      window.setTimeout(function () {
        window.location.replace(destination.href);
      }, 500);
    } catch (error) {
      console.error(error);
      showFallback('The routing registry could not be loaded.');
    }
  }());
</script>
</body>
</html>
